<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions for rings -->
    <radialGradient id="ring0Gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="ring1Gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.8" />
    </radialGradient>

    <radialGradient id="ring2Gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:0.6" />
    </radialGradient>

    <radialGradient id="ring3Gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:0.4" />
    </radialGradient>

    <radialGradient id="ring4Gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#bfdbfe;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d1d5db;stop-opacity:0.2" />
    </radialGradient>

    <!-- Filter for subtle glow effect on inner rings -->
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Filter for wave effect -->
    <filter id="waveEffect">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#fafafa"/>

  <!-- Concentric rings with gradients -->

  <!-- Ring 4 (outermost) -->
  <circle cx="400" cy="400" r="360" fill="url(#ring4Gradient)" stroke="#d1d5db" stroke-width="1" opacity="0.6"/>

  <!-- Ring 3 -->
  <circle cx="400" cy="400" r="280" fill="url(#ring3Gradient)" stroke="#9ca3af" stroke-width="1.5" filter="url(#glowEffect)" opacity="0.75"/>

  <!-- Ring 2 -->
  <circle cx="400" cy="400" r="200" fill="url(#ring2Gradient)" stroke="#60a5fa" stroke-width="2" filter="url(#glowEffect)" opacity="0.85"/>

  <!-- Ring 1 -->
  <circle cx="400" cy="400" r="120" fill="url(#ring1Gradient)" stroke="#3b82f6" stroke-width="2.5" filter="url(#glowEffect)" opacity="0.95"/>

  <!-- Ring 0 (center) -->
  <circle cx="400" cy="400" r="50" fill="url(#ring0Gradient)" stroke="#1e40af" stroke-width="3"/>

  <!-- Wave lines suggesting outward expansion -->
  <g stroke="#2563eb" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4">
    <circle cx="400" cy="400" r="140" fill="none"/>
    <circle cx="400" cy="400" r="220" fill="none"/>
    <circle cx="400" cy="400" r="320" fill="none"/>
  </g>

  <!-- Center label -->
  <text x="400" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Software
  </text>
  <text x="400" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Development
  </text>

  <!-- Ring 1 labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">
    <!-- Top -->
    <text x="400" y="260">Data Science</text>
    <!-- Right -->
    <text x="530" y="413">DevOps</text>
    <!-- Bottom -->
    <text x="400" y="550">Quantitative</text>
    <text x="400" y="567">Finance</text>
    <!-- Left -->
    <text x="270" y="413">Technical</text>
    <text x="270" y="430">Writing</text>
  </g>

  <!-- Ring 2 labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#1e293b">
    <!-- Top-right -->
    <text x="530" y="280">Legal</text>
    <!-- Right -->
    <text x="620" y="370">Accounting</text>
    <text x="620" y="435">Academic</text>
    <text x="620" y="450">Research</text>
    <!-- Bottom-right -->
    <text x="530" y="545">UX Design</text>
    <!-- Bottom -->
    <text x="320" y="600">Marketing</text>
    <text x="320" y="615">Analytics</text>
    <!-- Bottom-left -->
    <text x="180" y="545">Consulting</text>
    <!-- Left -->
    <text x="180" y="370">Journalism</text>
  </g>

  <!-- Ring 3 labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#334155">
    <!-- Top -->
    <text x="400" y="120">Education</text>
    <!-- Top-right -->
    <text x="550" y="180">Architecture</text>
    <!-- Right -->
    <text x="680" y="320">HR</text>
    <!-- Bottom-right -->
    <text x="570" y="650">Emergency</text>
    <text x="570" y="665">Services</text>
    <!-- Bottom -->
    <text x="230" y="650">Performing</text>
    <text x="230" y="665">Arts</text>
    <!-- Bottom-left -->
    <text x="150" y="630">Skilled Trades</text>
    <!-- Left -->
    <text x="120" y="320">Social Work</text>
  </g>

  <!-- Ring 4 labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" text-anchor="middle" fill="#475569">
    <!-- Top-right -->
    <text x="600" y="110">Medicine</text>
  </g>

  <!-- Legend / Key -->
  <g>
    <!-- Legend background -->
    <rect x="20" y="20" width="280" height="120" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4" opacity="0.95"/>

    <!-- Legend title -->
    <text x="30" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">
      Agentification Shockwave
    </text>

    <!-- Legend items -->
    <line x1="30" y1="55" x2="50" y2="55" stroke="#2563eb" stroke-width="3"/>
    <text x="60" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e293b">
      High impact (adjacent to software dev)
    </text>

    <line x1="30" y1="75" x2="50" y2="75" stroke="#93c5fd" stroke-width="3"/>
    <text x="60" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e293b">
      Moderate impact (emerging)
    </text>

    <line x1="30" y1="95" x2="50" y2="95" stroke="#bfdbfe" stroke-width="3"/>
    <text x="60" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e293b">
      Emerging impact (early-stage)
    </text>

    <text x="30" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b" font-style="italic">
      Proximity indicates integration potential
    </text>
  </g>

  <!-- Title/caption at bottom -->
  <text x="400" y="765" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#64748b" font-style="italic">
    How AI agentification spreads outward from software development
  </text>
</svg>