<svg width="640" height="500" viewBox="0 0 640 500" xmlns="http://www.w3.org/2000/svg">
    <style>
        .container {
            fill: #ffffff;
            stroke: #e7e5e4;
            stroke-width: 1.5;
        }
        .title-box {
            fill: #fafaf9;
            stroke: #e7e5e4;
            stroke-width: 1.5;
        }
        .title-text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 16px;
            font-weight: 600;
            fill: #1c1917;
            text-anchor: middle;
        }
        .box {
            fill: #ffffff;
            stroke: #e7e5e4;
            stroke-width: 1.5;
            rx: 8;
        }
        .box-title {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 14px;
            font-weight: 600;
            fill: #1c1917;
            text-anchor: middle;
        }
        .list-item {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 12px;
            fill: #57534e;
        }
        .eg-text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-style: normal;
            font-size: 12px;
            fill: #57534e;
            font-weight: 600;
        }
        .eg-label {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-style: normal;
            font-size: 12px;
            fill: #57534e;
        }
        .footer-text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 13px;
            fill: #57534e;
            text-anchor: middle;
            font-weight: 500;
        }
    </style>

    <rect x="10" y="10" width="620" height="480" class="container" rx="8" />
    <rect x="10" y="10" width="620" height="40" class="title-box" rx="8" ry="8" />
    <line x1="10" y1="50" x2="630" y2="50" stroke="#e7e5e4" stroke-width="1.5" />
    <text x="320" y="35" class="title-text">THE SAME MODEL...</text>

    <!-- Approved Channel Box -->
    <rect x="40" y="70" width="270" height="330" class="box" />
    <text x="175" y="95" class="box-title">APPROVED CHANNEL</text>
    
    <text x="60" y="125" class="list-item"><tspan fill="#16a34a" font-weight="bold">•</tspan> Enterprise agreement</text>
    <text x="60" y="150" class="list-item"><tspan fill="#16a34a" font-weight="bold">•</tspan> Data doesn't train model</text>
    <text x="60" y="175" class="list-item"><tspan fill="#16a34a" font-weight="bold">•</tspan> Audit logging</text>
    <text x="60" y="200" class="list-item"><tspan fill="#16a34a" font-weight="bold">•</tspan> SSO/identity</text>
    <text x="60" y="225" class="list-item"><tspan fill="#16a34a" font-weight="bold">•</tspan> IT/compliance approved</text>

    <text x="60" y="315" class="eg-label">Current Examples:</text>
    <text x="60" y="335" class="eg-text">Copilot, Azure OpenAI,</text>
    <text x="60" y="350" class="eg-text">enterprise API</text>

    <!-- Unapproved Channel Box -->
    <rect x="330" y="70" width="270" height="330" class="box" />
    <text x="465" y="95" class="box-title">UNAPPROVED CHANNEL</text>

    <text x="350" y="125" class="list-item"><tspan fill="#ca8a04" font-weight="bold">•</tspan> Personal web interface</text>
    <text x="350" y="150" class="list-item"><tspan fill="#ca8a04" font-weight="bold">•</tspan> May train on your inputs</text>
    <text x="350" y="175" class="list-item"><tspan fill="#ca8a04" font-weight="bold">•</tspan> No audit</text>
    <text x="350" y="200" class="list-item"><tspan fill="#ca8a04" font-weight="bold">•</tspan> Personal account</text>
    <text x="350" y="225" class="list-item"><tspan fill="#ca8a04" font-weight="bold">•</tspan> Shadow IT</text>

    <text x="350" y="315" class="eg-label">Current Examples:</text>
    <text x="350" y="335" class="eg-text">claude.ai personal login,</text>
    <text x="350" y="350" class="eg-text">ChatGPT free tier</text>

    <!-- Footer Text -->
    <text x="320" y="435" class="footer-text">Same underlying model capability</text>
    <text x="320" y="460" class="footer-text">Completely different risk profile</text>
</svg>
