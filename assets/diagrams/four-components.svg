<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #ffffff;
            stroke: #e7e5e4;
            stroke-width: 1.5;
            rx: 8;
        }
        .text-title {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 16px;
            font-weight: 600;
            fill: #1c1917;
            text-anchor: middle;
        }
        .text-desc {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 13px;
            fill: #57534e;
            text-anchor: middle;
        }
        .arrow {
            stroke: #a8a29e;
            stroke-width: 1.5;
            marker-end: url(#arrowhead);
        }
    </style>
    <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8a29e" />
        </marker>
    </defs>

    <!-- Boxes -->
    <rect x="30" y="50" width="160" height="120" class="box" />
    <rect x="240" y="50" width="160" height="120" class="box" />
    <rect x="450" y="50" width="160" height="120" class="box" />
    <rect x="240" y="250" width="160" height="120" class="box" />

    <!-- Box Content -->
    <!-- Prompt -->
    <text x="110" y="80" class="text-title">PROMPT</text>
    <text x="110" y="105" class="text-desc">Your input</text>
    <text x="110" y="125" class="text-desc">+ system</text>
    <text x="110" y="145" class="text-desc">context</text>

    <!-- Agent -->
    <text x="320" y="80" class="text-title">AGENT</text>
    <text x="320" y="100" class="text-desc">(model)</text>
    <text x="320" y="125" class="text-desc">Interprets,</text>
    <text x="320" y="145" class="text-desc">reasons, decides</text>

    <!-- Tools -->
    <text x="530" y="80" class="text-title">TOOLS</text>
    <text x="530" y="105" class="text-desc">What agent</text>
    <text x="530" y="125" class="text-desc">can do in</text>
    <text x="530" y="145" class="text-desc">the world</text>

    <!-- Persistence -->
    <text x="320" y="280" class="text-title">PERSISTENCE</text>
    <text x="320" y="300" class="text-desc">/ MEMORY</text>
    <text x="320" y="325" class="text-desc">What carries</text>
    <text x="320" y="345" class="text-desc">across interactions</text>

    <!-- Arrows -->
    <line x1="190" y1="110" x2="230" y2="110" class="arrow" />
    <line x1="400" y1="110" x2="440" y2="110" class="arrow" />
    <line x1="320" y1="170" x2="320" y2="240" class="arrow" />
</svg>
