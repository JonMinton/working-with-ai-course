<svg width="700" height="280" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">
    <style>
        .container {
            fill: #ffffff;
            stroke: #e7e5e4;
            stroke-width: 1.5;
            rx: 8;
        }
        .box {
            fill: #ffffff;
            stroke: #e7e5e4;
            stroke-width: 1.5;
            rx: 8;
        }
        .text-title {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 16px;
            font-weight: 600;
            fill: #1c1917;
            text-anchor: middle;
        }
        .text-desc {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 13px;
            fill: #57534e;
            text-anchor: middle;
        }
        .arrow {
            stroke: #a8a29e;
            stroke-width: 1.5;
            marker-end: url(#arrowhead);
        }
        .footer-text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 12px;
            fill: #57534e;
            text-anchor: middle;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
    <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8a29e" />
        </marker>
    </defs>

    <rect x="10" y="10" width="680" height="260" class="container" />

    <!-- Boxes -->
    <rect x="40" y="50" width="120" height="100" class="box" />
    <rect x="200" y="50" width="120" height="100" class="box" />
    <rect x="360" y="50" width="120" height="100" class="box" />
    <rect x="520" y="50" width="120" height="100" class="box" />

    <!-- Box Content -->
    <!-- Source -->
    <text x="100" y="80" class="text-title">Source</text>
    <text x="100" y="105" class="text-desc">(e.g. PDF)</text>

    <!-- Zotero -->
    <text x="260" y="80" class="text-title">Zotero</text>
    <text x="260" y="105" class="text-desc">Manage</text>
    <text x="260" y="125" class="text-desc">citations</text>

    <!-- Obsidian -->
    <text x="420" y="80" class="text-title">Obsidian</text>
    <text x="420" y="105" class="text-desc">Synthesise,</text>
    <text x="420" y="125" class="text-desc">connect</text>

    <!-- LaTeX / Word -->
    <text x="580" y="80" class="text-title">LaTeX</text>
    <text x="580" y="100" class="text-desc">/ Word</text>
    <text x="580" y="125" class="text-desc">Format</text>

    <!-- Arrows -->
    <line x1="160" y1="100" x2="190" y2="100" class="arrow" />
    <line x1="320" y1="100" x2="350" y2="100" class="arrow" />
    <line x1="480" y1="100" x2="510" y2="100" class="arrow" />
    
    <!-- Footer Text -->
    <text x="350" y="220" class="footer-text">HUMAN-CENTRIC, AI-ASSISTED WORKFLOW FOR LITERATURE</text>

</svg>
