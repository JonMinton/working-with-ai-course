<svg width="540" height="180" viewBox="0 0 540 180" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box {
            fill: #ffffff;
            stroke: #e7e5e4;
            stroke-width: 1.5;
            rx: 8;
        }
        .text-title {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 16px;
            font-weight: 600;
            fill: #1c1917;
            text-anchor: middle;
        }
        .text-desc {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 13px;
            fill: #57534e;
            text-anchor: middle;
        }
        .arrow {
            stroke: #a8a29e;
            stroke-width: 1.5;
        }
        .arrow-head {
            fill: #a8a29e;
        }
    </style>
    <defs>
        <marker id="arrowhead-right" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
        </marker>
        <marker id="arrowhead-left" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 10 0 L 0 5 L 10 10 z" class="arrow-head" />
        </marker>
    </defs>

    <!-- Boxes -->
    <rect x="30" y="40" width="140" height="100" class="box" />
    <rect x="200" y="40" width="140" height="100" class="box" />
    <rect x="370" y="40" width="140" height="100" class="box" />

    <!-- Box Content -->
    <!-- AI Model -->
    <text x="100" y="80" class="text-title">AI</text>
    <text x="100" y="105" class="text-desc">Model</text>

    <!-- MCP Protocol -->
    <text x="270" y="80" class="text-title">MCP</text>
    <text x="270" y="105" class="text-desc">Protocol</text>

    <!-- Tools & APIs -->
    <text x="440" y="80" class="text-title">Tools</text>
    <text x="440" y="105" class="text-desc">&amp; APIs</text>

    <!-- Arrows -->
    <line x1="170" y1="80" x2="195" y2="80" class="arrow" marker-end="url(#arrowhead-right)" />
    <line x1="195" y1="100" x2="170" y2="100" class="arrow" marker-end="url(#arrowhead-left)" />
    
    <line x1="340" y1="80" x2="365" y2="80" class="arrow" marker-end="url(#arrowhead-right)" />
    <line x1="365" y1="100" x2="340" y2="100" class="arrow" marker-end="url(#arrowhead-left)" />
</svg>
